"""
An AccessManager indexed by this subgraph. id = lowercased AM address (event.address). One row per
manager per chain: the Dawn RoycoFactory and — on chains where Royco Day is deployed — the Day
RoycoAccessManager. `kind` ("dawn" | "day") comes from data-source context; the catalog is the
authority for kind-by-address.
"""
type Manager @entity(immutable: false) {
  id: ID!
  address: Bytes!
  kind: String!
  expiration: BigInt!
  minSetback: BigInt!
  roles: [Role!]! @derivedFrom(field: "manager")
  targets: [TargetContract!]! @derivedFrom(field: "manager")
}

"""
An AccessManager role. id = "{manager}-{roleId}" (role ids collide across the Dawn and Day AMs —
both derive them from the same keccak tag strings — so every role row is manager-scoped).
`roleId` is the raw uint64 as a decimal; consumers must never parse the composite id.
adminRole/guardianRole default to 0 (ADMIN_ROLE) until an explicit change event is seen.
"""
type Role @entity(immutable: false) {
  id: ID!
  manager: Manager!
  roleId: BigInt!
  onChainLabel: String
  adminRole: BigInt!
  guardianRole: BigInt!
  grantDelay: BigInt!
  members: [RoleMember!]! @derivedFrom(field: "role")
  functions: [TargetFunction!]! @derivedFrom(field: "role")
  events: [RoleEvent!]! @derivedFrom(field: "role")
}

"""
Current membership of (manager, role, account). Rows are retained after revocation (active=false)
so the holder set is `members(where: {active: true})`.
"""
type RoleMember @entity(immutable: false) {
  id: ID! # "{manager}-{roleId}-{account}"
  manager: Manager!
  role: Role!
  account: Account!
  executionDelay: BigInt!
  active: Boolean!
  grantedAt: BigInt
  revokedAt: BigInt
  pendingDelayEffective: BigInt
  grantTx: Bytes
}

enum RoleEventKind {
  Granted
  Revoked
  ExecutionDelayChanged
  AdminChanged
  GuardianChanged
  GrantDelayChanged
  Labeled
}

"""
Immutable historical record of any role-level change. The membership timeline.
"""
type RoleEvent @entity(immutable: true) {
  id: ID! # "{txHash}-{logIndex}"
  manager: Manager!
  role: Role!
  account: Account
  kind: RoleEventKind!
  oldValue: String
  newValue: String
  effectiveAt: BigInt # `since` for grant / delay events
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
A contract gated by an AccessManager. id = "{manager}-{address}" — the same contract may be gated
by both AMs (e.g. a vault mid-migration from Dawn to Day). `everConfigured` mirrors the Day AM's
`wasEverConfigured` flag (event-sourced from TargetConfiguredAtGenesis; always false for Dawn).
"""
type TargetContract @entity(immutable: false) {
  id: ID!
  manager: Manager!
  address: Bytes!
  closed: Boolean!
  adminDelay: BigInt!
  everConfigured: Boolean!
  firstConfiguredAt: BigInt
  firstConfiguredTx: Bytes
  functions: [TargetFunction!]! @derivedFrom(field: "target")
}

"""
A (manager, target, selector) -> role binding: the capability edge.
"""
type TargetFunction @entity(immutable: false) {
  id: ID! # "{manager}-{target}-{selector}"
  manager: Manager!
  target: TargetContract!
  selector: Bytes!
  role: Role!
  updatedAt: BigInt!
  txHash: Bytes!
}

enum OperationStatus {
  Scheduled
  Executed
  Canceled
}

"""
A scheduled (timelocked) operation. id = "{manager}-{operationId}-{nonce}" where operationId =
hashOperation(caller, target, data) — hashed without the AM address, so the same call scheduled on
both AMs would collide without the manager prefix. The nonce is included so a re-scheduled op
(same hash, new nonce) is a distinct row rather than overwriting the prior lifecycle;
Executed/Canceled events carry the nonce, so the key is reconstructable.
"""
type Operation @entity(immutable: false) {
  id: ID!
  manager: Manager!
  operationId: Bytes!
  nonce: BigInt!
  caller: Bytes!
  target: Bytes!
  data: Bytes!
  schedule: BigInt! # unix ts when it becomes executable
  status: OperationStatus!
  scheduledAt: BigInt!
  executedAt: BigInt
  canceledAt: BigInt
  scheduleTx: Bytes!
  executeTx: Bytes
  cancelTx: Bytes
}

"""
Any address that has ever held an AM role or a native vault role. Global (id = address) — the
cross-manager join point: an account's role rows span both AMs via `roles.manager`.
"""
type Account @entity(immutable: false) {
  id: ID! # address
  roles: [RoleMember!]! @derivedFrom(field: "account")
  nativeRoles: [NativeRoleMember!]! @derivedFrom(field: "account")
}

# ── Royco markets (Dawn RoycoFactory MarketDeployed + Day factory MarketDeploymentCompleted) ────

"""
A Royco market: the contract set deployed atomically through a registered factory. Dawn markets
come from the Dawn RoycoFactory's MarketDeployed (4 contracts; day-only fields zero, tranche
names/symbols from the deployment params); Day markets from the Day factory's
MarketDeploymentCompleted (7 components). id = kernel address, lowercased (unique per deployment).
"""
type Market @entity(immutable: true) {
  id: ID!
  kind: String! # "dawn" | "day"
  factory: Bytes!
  template: Bytes # Day only
  deployer: Bytes # Day only (Dawn's event carries no deployer; the factory call is permissioned)
  seniorTranche: Bytes!
  juniorTranche: Bytes!
  liquidityProviderTranche: Bytes! # zero for Dawn
  kernel: Bytes!
  accountant: Bytes!
  ydm: Bytes! # zero for Dawn
  lptYdm: Bytes! # zero for Dawn
  extras: Bytes!
  seniorTrancheName: String # Dawn only
  seniorTrancheSymbol: String # Dawn only
  juniorTrancheName: String # Dawn only
  juniorTrancheSymbol: String # Dawn only
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  components: [MarketComponent!]! @derivedFrom(field: "market")
}

"""
Reverse index address -> (market, componentType) so arbitrary AM targets can be labeled as market
components. id = "{kernel}-{componentType}" — NOT the component address: YDM singletons are shared
across markets, so an address key would collide on an immutable entity. Address lookups filter on
`address` and may legitimately return multiple rows.
"""
type MarketComponent @entity(immutable: true) {
  id: ID!
  market: Market!
  address: Bytes!
  componentType: String! # seniorTranche|juniorTranche|liquidityProviderTranche|kernel|accountant|ydm|lptYdm
}

# ── Native OZ AccessControl on the Concrete vaults (bytes32 roles) ──────────────

"""
A native AccessControl role on a Concrete vault. id = "{vault}-{roleHash}".
"""
type NativeRole @entity(immutable: false) {
  id: ID!
  vault: Bytes!
  roleHash: Bytes!
  adminRoleHash: Bytes!
  members: [NativeRoleMember!]! @derivedFrom(field: "nativeRole")
}

type NativeRoleMember @entity(immutable: false) {
  id: ID! # "{vault}-{roleHash}-{account}"
  nativeRole: NativeRole!
  account: Account!
  active: Boolean!
  grantedAt: BigInt
  revokedAt: BigInt
}

type NativeRoleEvent @entity(immutable: true) {
  id: ID! # "{txHash}-{logIndex}"
  nativeRole: NativeRole!
  account: Bytes!
  sender: Bytes!
  kind: String!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}
